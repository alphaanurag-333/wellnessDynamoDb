<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>IR Wellness Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="root">
      <div class="ua-brand-loader" role="status" aria-live="polite" aria-busy="true">
        <div class="ua-brand-loader__stage">
          <div class="ua-brand-loader__mark">
            <span class="ua-brand-loader__orbit" aria-hidden="true"></span>
            <span class="ua-brand-loader__glow" aria-hidden="true"></span>
            <img
              class="ua-brand-loader__logo"
              src="/irw-loader.png"
              alt="India Redefining Wellness"
              width="140"
              height="140"
            />
          </div>
          <p class="ua-brand-loader__label">Loading Wellness Console...</p>
          <div class="ua-brand-loader__dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
