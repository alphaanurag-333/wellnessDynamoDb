<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IR Wellness</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      #root { min-height: 100dvh; }
      .site-loader {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
      }
      .site-loader--overlay {
        position: fixed;
        inset: 0;
        z-index: 10050;
        min-height: 100dvh;
        padding: 1.5rem;
        background:
          radial-gradient(ellipse 80% 55% at 50% 42%, rgba(231, 134, 58, 0.14), transparent 58%),
          radial-gradient(ellipse 50% 40% at 16% 82%, rgba(19, 136, 8, 0.1), transparent 52%),
          #fef4ed;
      }
      .site-loader__stage {
        display: grid;
        justify-items: center;
        gap: 1.1rem;
      }
      .site-loader__mark {
        position: relative;
        width: 10.5rem;
        height: 10.5rem;
        display: grid;
        place-items: center;
      }
      .site-loader__orbit {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #e7863a 0%, #fff 28%, #138808 54%, #1e3a5f 80%, #e7863a 100%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 2.5px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 2.5px));
        animation: site-loader-orbit 1.35s linear infinite;
      }
      .site-loader__glow {
        position: absolute;
        inset: 0.75rem;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(231, 134, 58, 0.28), transparent 72%);
        filter: blur(6px);
      }
      .site-loader__logo {
        position: relative;
        z-index: 1;
        width: 8.75rem;
        height: 8.75rem;
        object-fit: cover;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(30, 58, 95, 0.08), 0 14px 36px rgba(30, 58, 95, 0.16);
        animation: site-loader-pulse 2.4s ease-in-out infinite;
      }
      .site-loader__caption {
        margin: 0.15rem 0 0;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #6b778c;
      }
      .site-loader__dots { display: flex; gap: 0.5rem; }
      .site-loader__dots span {
        width: 0.44rem;
        height: 0.44rem;
        border-radius: 50%;
        background: #e7863a;
        opacity: 0.4;
        animation: site-loader-dot 1.2s ease-in-out infinite;
      }
      .site-loader__dots span:nth-child(2) { animation-delay: 0.15s; background: #1e3a5f; }
      .site-loader__dots span:nth-child(3) { animation-delay: 0.3s; background: #138808; }
      .site-loader__label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }
      @keyframes site-loader-orbit { to { transform: rotate(360deg); } }
      @keyframes site-loader-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      @keyframes site-loader-dot {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
        40% { transform: translateY(-5px); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .site-loader__orbit,
        .site-loader__logo,
        .site-loader__dots span { animation: none; }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
  </head>
  <body>
    <div id="root">
      <div class="site-loader site-loader--overlay" role="status" aria-live="polite" aria-busy="true">
        <div class="site-loader__stage">
          <div class="site-loader__mark">
            <span class="site-loader__orbit" aria-hidden="true"></span>
            <span class="site-loader__glow" aria-hidden="true"></span>
            <img
              class="site-loader__logo"
              src="/irw-loader.png"
              alt="India Redefining Wellness"
              width="140"
              height="140"
            />
          </div>
          <p class="site-loader__caption">Loading…</p>
          <div class="site-loader__dots" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>
        <span class="site-loader__label">Loading</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
