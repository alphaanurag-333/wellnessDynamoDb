<!DOCTYPE html>

<head>

  <title>IR Wellness Admin Panel — Complete Manual</title>
  <style>
    :root {
      --bg: #0f1f17;
      --panel: #163126;
      --card: #1c3d2f;
      --line: #2f5a45;
      --text: #eef6f1;
      --muted: #a8c4b5;
      --accent: #34a56a;
      --accent-2: #f0a91b;
      --warn: #ec7a45;
      --info: #5e6ad2;
      --client: #0d9488;
      --coach: #7c3aed;
      --admin: #c0392b;
      --radius: 16px;
      --shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1f4a35 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #2a3d55 0%, transparent 50%),
        var(--bg);
      color: var(--text);
    }
    .shell {
      max-width: 85%;
      margin: 0 auto;
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 18px 18px 12px;
      gap: 14px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .brand strong { font-size: 1.15rem; letter-spacing: .02em; }
    .brand span { color: var(--muted); font-size: .9rem; }
    .url {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      color: var(--muted);
      font-size: .85rem;
      text-decoration: none;
    }
    .url b { color: var(--accent); font-weight: 600; }
    .stage {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 14px;
      min-height: 0;
    }
    @media (max-width: 980px) {
      .stage { grid-template-columns: 1fr; }
      .toc { max-height: 180px; }
    }
    .toc, .slide-card {
      background: linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%), var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .toc {
      padding: 12px;
      overflow: auto;
    }
    .toc h2 {
      margin: 4px 8px 10px;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--muted);
      font-weight: 700;
    }
    .toc button {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 8px;
      align-items: start;
      font: inherit;
    }
    .toc button:hover { background: rgba(52,165,106,.12); color: var(--text); }
    .toc button.active {
      background: rgba(52,165,106,.22);
      color: var(--text);
      outline: 1px solid rgba(52,165,106,.45);
    }
    .toc .n {
      width: 28px; height: 28px; border-radius: 8px;
      display: grid; place-items: center;
      background: rgba(255,255,255,.06);
      color: var(--accent);
      font-size: .75rem; font-weight: 700;
    }
    .toc button.active .n { background: var(--accent); color: #062416; }
    .toc .t { font-size: .86rem; line-height: 1.25; }
    .slide-card {
      padding: 18px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 14px;
      min-height: 640px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .pill {
      font-size: .75rem;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: rgba(0,0,0,.18);
    }
    .pill.step { color: #d7ffe8; border-color: rgba(52,165,106,.5); background: rgba(52,165,106,.18); }
    .pill.warn { color: #ffe3c8; border-color: rgba(240,169,27,.45); background: rgba(240,169,27,.14); }
    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2.2vw, 1.85rem);
      line-height: 1.2;
    }
    .lead { margin: 0; color: var(--muted); font-size: .98rem; max-width: 72ch; }
    .body {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 14px;
      min-height: 0;
    }
    @media (max-width: 900px) {
      .body { grid-template-columns: 1fr; }
    }
    .shot, .facts {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(0,0,0,.18);
      overflow: hidden;
      min-height: 280px;
    }
    .shot {
      position: relative;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(52,165,106,.08), transparent 40%),
        rgba(0,0,0,.25);
    }
    .shot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      max-height: 460px;
      background: #0a1510;
    }
    .shot.multi {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 36px 8px 8px;
      place-items: stretch;
    }
    .shot.multi img { max-height: 220px; border-radius: 8px; }
    .shot .placeholder {
      padding: 28px;
      text-align: center;
      color: var(--muted);
      max-width: 36ch;
    }
    .shot .placeholder strong { display: block; color: var(--text); margin-bottom: 8px; font-size: 1.05rem; }
    .shot .badge {
      position: absolute;
      left: 12px; top: 12px;
      background: rgba(6,36,22,.85);
      border: 1px solid rgba(52,165,106,.4);
      color: #b9f0d0;
      font-size: .72rem;
      padding: 5px 9px;
      border-radius: 999px;
    }
    .facts { padding: 14px 16px; overflow: auto; }
    .facts h3 {
      margin: 0 0 10px;
      font-size: .78rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .facts ol, .facts ul { margin: 0; padding-left: 1.15rem; }
    .facts li { margin: 0 0 10px; line-height: 1.45; color: #d7e8de; }
    .facts li strong { color: #fff; }
    .source {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      border: 1px dashed rgba(94,106,210,.55);
      background: rgba(94,106,210,.12);
    }
    .source .label {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #c5caf5;
      margin-bottom: 6px;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag {
      font-size: .72rem;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .tag.client { background: rgba(13,148,136,.2); color: #7ee7d8; }
    .tag.coach { background: rgba(124,58,237,.2); color: #d2b4ff; }
    .tag.admin { background: rgba(192,57,43,.2); color: #ffb4aa; }
    .tag.api { background: rgba(52,165,106,.18); color: #9de8bf; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .nav-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    button.ctrl {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
    }
    button.ctrl.primary {
      background: linear-gradient(135deg, #2e9e5f, #34a56a);
      border-color: transparent;
      color: #062416;
    }
    button.ctrl:disabled { opacity: .4; cursor: not-allowed; }
    .progress {
      flex: 1;
      min-width: 160px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      overflow: hidden;
    }
    .progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #7ad0a1);
      transition: width .25s ease;
    }
    footer {
      color: var(--muted);
      font-size: .8rem;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    kbd {
      font: 600 .75rem ui-monospace, Consolas, monospace;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(0,0,0,.25);
    }
  </style>
</head>

    const toc = document.getElementById("toc");
    const meta = document.getElementById("meta");
    const title = document.getElementById("title");
    const lead = document.getElementById("lead");
    const shot = document.getElementById("shot");
    const facts = document.getElementById("facts");
    const bar = document.getElementById("bar");
    const pageLabel = document.getElementById("pageLabel");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const playBtn = document.getElementById("playBtn");

    let index = 0;
    let timer = null;

    function tagHtml(tags = []) {
      return tags.map((t) => `<span class="tag ${t}">${t}</span>`).join("");
    }

    function render() {
      const s = slides[index];
      toc.innerHTML = `<h2>Chapters</h2>` + slides.map((item, i) => `
        <button type="button" class="${i === index ? "active" : ""}" data-i="${i}">
          <span class="n">${String(i + 1).padStart(2, "0")}</span>
          <span class="t">${item.title.replace(/^Step \d+ — /, "")}</span>
        </button>
      `).join("");

      meta.innerHTML = `
        <span class="pill step">Step ${index + 1} / ${slides.length}</span>
        <span class="pill">${s.chapter}</span>
        ${s.shot ? '<span class="pill">Screenshot attached</span>' : '<span class="pill warn">Screenshot after login</span>'}
      `;
      title.textContent = s.title;
      lead.innerHTML = s.lead;

      if (s.shot) {
        shot.classList.toggle("multi", Boolean(s.shot2));
        shot.innerHTML = `    
          <span class="badge">${s.shotLabel || "Screenshot"}</span>
          <img src="${s.shot}" alt="${s.title}" />
          ${s.shot2 ? `<img src="${s.shot2}" alt="${s.title} (2)" />` : ""}
        `;
      } else {
        shot.classList.remove("multi");
        shot.innerHTML = `
          <span class="badge">Pending capture</span>
          <div class="placeholder">
            <strong>${s.chapter}</strong>
            ${s.shotNote || "Live screenshot will appear here after login."}
          </div>
        `;
      }

      facts.innerHTML = `
        <h3>Step-by-step</h3>
        <ol>${s.steps.map((x) => `<li>${x}</li>`).join("")}</ol>
        <div class="source">
          <div class="label">Where the data comes from</div>
          <div>${s.source}</div>
          <div class="tags">${tagHtml(s.tags)}</div>
        </div>
      `;

      bar.style.width = `${((index + 1) / slides.length) * 100}%`;
      pageLabel.textContent = `${index + 1} of ${slides.length}`;
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === slides.length - 1;

      toc.querySelectorAll("button[data-i]").forEach((btn) => {
        btn.addEventListener("click", () => {
          index = Number(btn.dataset.i);
          stopPlay();
          render();
        });
      });
    }

    function stopPlay() {
      if (timer) {
        clearInterval(timer);
        timer = null;
        playBtn.textContent = "▶ Auto-play";
      }
    }

    function startPlay() {
      stopPlay();
      playBtn.textContent = "❚❚ Pause";
      timer = setInterval(() => {
        if (index >= slides.length - 1) {
          stopPlay();
          return;
        }
        index += 1;
        render();
      }, 8000);
    }

    prevBtn.addEventListener("click", () => {
      stopPlay();
      if (index > 0) { index -= 1; render(); }
    });
    nextBtn.addEventListener("click", () => {
      stopPlay();
      if (index < slides.length - 1) { index += 1; render(); }
    });
    playBtn.addEventListener("click", () => {
      if (timer) stopPlay();
      else startPlay();
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") nextBtn.click();
      if (e.key === "ArrowLeft") prevBtn.click();
    });

    render();
  </script>
